; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev

; Serial monitor baud rate (must match Serial.begin() in code)
monitor_speed = 115200
 
; ── Libraries ─────────────────────────────────────────────────
; Uncomment the fingerprint library when you add real hardware.
lib_deps =
    https://github.com/johnrickman/LiquidCrystal_I2C.git
    ; adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.0
    ; adafruit/Adafruit BusIO @ ^1.14.0   ; required by above
 
; ── Build flags (optional but useful) ─────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=1    ; show ESP32 debug info in monitor

    