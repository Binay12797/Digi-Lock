<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Authorization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="auth">
  <div class="page-wrap">
    <h1>Authorization System</h1>
    <div class="mode-indicator">Buzzer: beep per step, alarm on lockout</div>

    <div class="card">
      <h2>Verify Access</h2>
      <p>Select an enrolled ID from the list below, or type it in manually, then press Check Authorization.</p><br>
      <select id="uidSelect"></select><br><br>
      <input type="text" id="uidField" placeholder="Unique ID (e.g. FP-A1B2)" /><br><br>
      <button id="checkBtn" class="primary">Check Authorization</button>
      <p style="margin-top:0.6em;color:#9a7850;font-size:0.8em">Enrolled users: <span id="userCount">0</span></p>
      <div id="authResult" class="status-line" style="margin-top:0.8em;text-align:center;font-size:0.95em">Ready</div>
      <p id="attemptsLine" style="font-size:0.78em;color:#9a7850"></p>
      <div id="alarmLine" class="alarm-line" style="display:none"></div>
    </div>

    <div class="nav-btns">
      <a href="/" class="btn">Home</a>
      <a href="/mode/1" class="btn enroll">Switch to Enrollment</a>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
